name: Teaching Pack Builder pilot contract QA

on:
  pull_request:
    paths:
      - 'schemas/teaching-pack-builder.*.schema.json'
      - 'tests/fixtures/teaching-pack-builder/**'
      - 'tests/test_teaching_pack_contract.py'
      - 'tools/check_teaching_pack_contract.py'
      - 'tools/build-starter-pack.cjs'
      - 'curriculum/starter/**'
      - '.github/workflows/teaching-pack-contract.yml'
  push:
    branches: [main]
    paths:
      - 'schemas/teaching-pack-builder.*.schema.json'
      - 'tests/fixtures/teaching-pack-builder/**'
      - 'tests/test_teaching_pack_contract.py'
      - 'tools/check_teaching_pack_contract.py'
      - 'tools/build-starter-pack.cjs'
      - 'curriculum/starter/**'
      - '.github/workflows/teaching-pack-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install jsonschema==4.25.1
      - run: python tests/test_teaching_pack_contract.py
      - run: python tools/check_teaching_pack_contract.py
      - run: node tests/starter-pack.test.cjs
      - run: node tools/build-starter-pack.cjs --check
